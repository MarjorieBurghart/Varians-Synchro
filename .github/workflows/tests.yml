name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      varians_ref:
        description: "Version de Varians à tester (tag ou branche) ; vide : la dernière release publiée"
        required: false
        default: ""
  schedule:
    # Chaque lundi, même sans modification de Varians-Synchro : l'export est
    # rouvert avec la dernière release de Varians.
    - cron: "17 6 * * 1"

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Un test bloqué ne retient pas le job jusqu'à la limite de GitHub (6 h).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    env:
      # Qt sans écran : les tests de l'interface pilotent les fenêtres.
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      # Les projets exportés doivent s'ouvrir avec le vrai code de Varians
      # (tests/test_varians_094_compat.py) : sans lui, ces tests échouent.
      VARIANS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Version de Varians à tester
        # La compatibilité repose sur le format du projet, non sur un numéro
        # de Varians : la dernière release publiée est testée, sans rien
        # changer ici quand Varians en publie une nouvelle (ou la version
        # demandée en lançant le workflow à la main).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.varians_ref }}
        run: |
          ref="$REQUESTED"
          if [ -z "$ref" ]; then
            ref=$(gh release view --repo MarjorieBurghart/Varians --json tagName --jq .tagName)
          fi
          if [ -z "$ref" ]; then
            echo "::error::Aucune release de Varians trouvée"
            exit 1
          fi
          echo "Varians testé : $ref"
          echo "Varians testé : $ref" >> "$GITHUB_STEP_SUMMARY"
          echo "VARIANS_REF=$ref" >> "$GITHUB_ENV"

      - name: Varians (code source de la version testée)
        uses: actions/checkout@v5
        with:
          repository: MarjorieBurghart/Varians
          ref: ${{ env.VARIANS_REF }}
          path: varians-source

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt
            varians-source/requirements.txt

      - name: Dossier temporaire à nom long (Windows)
        # Le TEMP par défaut du serveur Windows est un nom court 8.3
        # (C:\Users\RUNNER~1\...), ce qui peut fausser des comparaisons de chemins.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Dossier temporaire sans lien symbolique (macOS)
        # /var/folders/… est un lien vers /private/var/… : un chemin résolu
        # (Path.resolve) ne serait plus égal au chemin du test.
        if: runner.os == 'macOS'
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Bibliothèques système pour Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Dépendances (Varians-Synchro et Varians, versions testées)
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt -r varians-source/requirements.txt -c constraints.txt
          echo "VARIANS_SOURCE=$GITHUB_WORKSPACE/varians-source" >> "$GITHUB_ENV"

      - name: Compilation de tous les modules
        run: python -m compileall -q varians_synchro tests tools

      - name: Contrôle de maintenance
        run: python tools/check_maintenance.py

      - name: Vérification du code (ruff)
        # Règles minimales, qui ne visent que de vrais défauts (ruff.toml).
        run: python -m ruff check .

      - name: Tests
        # -rfE : les tests en échec nommés en fin de passe ; un test qui
        # dépasse 5 minutes : pile d'appels affichée (faulthandler).
        run: python -m pytest -q --disable-warnings -rs -rfE -o faulthandler_timeout=300 tests
